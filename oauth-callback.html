<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>OAuth Callback – Vitalrepublik</title>
<style>
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:640px;margin:60px auto;padding:0 20px;color:#222;line-height:1.6;text-align:center}
h1{font-size:1.4rem}
.box{background:#f4f2ef;border-radius:10px;padding:20px;margin-top:24px;word-break:break-all;font-family:monospace;font-size:0.95rem}
button{margin-top:16px;padding:10px 20px;border-radius:24px;border:none;background:#111;color:#fff;font-weight:600;cursor:pointer}
.label{font-size:0.8rem;color:#888;margin-top:24px}
</style>
</head>
<body>
<h1>Autorisierung erhalten</h1>
<p>Code kopieren und an Claude weitergeben:</p>
<div class="box" id="code">–</div>
<button onclick="copyCode()">Code kopieren</button>
<p class="label">Vollständige Redirect-URL (zur Kontrolle):</p>
<div class="box" id="fullurl" style="font-size:0.75rem"></div>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code') || '(kein code-Parameter gefunden)';
  document.getElementById('code').textContent = code;
  document.getElementById('fullurl').textContent = window.location.href;
  function copyCode() { navigator.clipboard.writeText(code); }
</script>
</body>
</html>
